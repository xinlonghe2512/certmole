version: 2

project_name: certmole

before:
  hooks:
    - go mod tidy

builds:
  - id: certmole
    main: ./cmd/certmole
    binary: certmole

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - windows

    goarch:
      - amd64
      - arm64

    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64

    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}

    format_overrides:
      - goos: windows
        formats: [zip]
      
checksum:
  name_template: 'certmole-{{ .Version }}-checksums.txt'

release:
  github:
    owner: xinlonghe2512
    name: certmole